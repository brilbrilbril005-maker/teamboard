name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Типы, линтер, тесты, сборка
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      # Тесты с базой используют PostgreSQL в памяти — отдельный сервис не нужен.
      - run: pnpm test:coverage
      - run: pnpm build

  e2e:
    name: Сквозные тесты (компьютер и телефон)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: teamboard
          POSTGRES_PASSWORD: teamboard
          POSTGRES_DB: teamboard_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teamboard -d teamboard_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Учётные данные одноразовой базы внутри CI, не секрет.
      E2E_DATABASE_URL: postgres://teamboard:teamboard@localhost:5432/teamboard_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
